<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jon Daniel - Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="styleH.css">
</head>
<body>

  <div class="page">


    <aside class="profile">
      <p class="about-tab"><i class="ri-focus-3-line"></i> About Me</p>

      <ul class="side-nav">
        <li>Clients</li>
        <li>Research</li>
        <li>Portfolio</li>
        <li>Podcast</li>
      </ul>

      <div class="profile-card">
        <div class="ring">
          <div class="pink-circle">
            <img src="https://picsum.photos/id/1005/500/500?grayscale" alt="Jon Daniel">
          </div>
        </div>

        <h2 class="hello">Im,<br><strong>Jon<br>Daniel</strong></h2>

        <a href="mailto:inquiry@jondaniel.design" class="email">
          inquiry@jondaniel.design <i class="ri-mail-open-line"></i>
        </a>

        <div class="badge"><span></span></div>
      </div>
    </aside>

    <main class="content">

      <h1 class="title">Portfolio</h1>

      <div class="video">
        <img src="https://picsum.photos/id/1074/900/600" alt="Showreel">
        <button class="play" aria-label="Play video"><i class="ri-play-fill"></i></button>
      </div>

      <div class="stats">
        <div class="stat teal">
          <h3>251</h3>
          <p>Projects</p>
        </div>
        <div class="stat violet">
          <h3>156</h3>
          <p>Awards</p>
        </div>
      </div>

      <div class="clients">
        <i class="ri-apple-fill"></i>
        <p>Clients</p>
      </div>

      <div class="award">
        <div class="sphere"></div>
        <div class="award-text">
          <h3>172</h3>
          <p>Global Design Awards.</p>
        </div>
      </div>

    </main>
  </div>

</body>
</html>
